<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__REPO_GRAPH_TITLE__</title>
<style>
:root{
  --bg:#14171c; --panel:#1c2027; --panel2:#232833; --line:#39404d;
  --text:#d7dde6; --muted:#8b93a3; --accent:#5cc8ff; --hub:#e67e22;
  --cyc:#e0524d; --ext:#9aa3b2; --hull:#2a313d; --hit:#ffd166;
  --edge:#566070; --font:13px/1.45 ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --mono:ui-monospace,'JetBrains Mono','Fira Code',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--font);overflow:hidden}
#app{display:flex;height:100%}
#canvasWrap{flex:1;position:relative;min-width:0}
svg#canvas{width:100%;height:100%;display:block;cursor:grab}
svg#canvas.panning{cursor:grabbing}
#toolbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;
  background:rgba(28,32,39,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px;z-index:5;flex-wrap:wrap;max-width:calc(100% - 20px)}
#toolbar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
#toolbar button:hover{border-color:var(--accent);color:var(--accent)}
#toolbar label{display:flex;gap:5px;align-items:center;color:var(--muted);cursor:pointer;user-select:none}
#search{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:4px 8px;font:inherit;width:170px;outline:none}
#search:focus{border-color:var(--accent)}
#hint{position:absolute;bottom:8px;left:12px;color:var(--muted);font-size:11px;z-index:4;pointer-events:none}
#side{width:320px;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;overflow:hidden}
#side h1{font-size:14px;margin:0;padding:12px 14px 8px;font-family:var(--mono);word-break:break-all}
#side .sub{padding:0 14px 10px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}
#sideScroll{overflow-y:auto;flex:1;padding:10px 14px 20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.stat b{display:block;font-size:16px}
.stat span{color:var(--muted);font-size:11px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
#selPath{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--panel2);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 8px;
  font-size:11px;color:var(--muted);margin:6px 6px 0 0}
.tag.cyc{color:var(--cyc);border-color:var(--cyc)}
.tag.hub{color:var(--hub);border-color:var(--hub)}
ul.links{list-style:none;margin:4px 0 0;padding:0}
ul.links li{padding:4px 6px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
ul.links li:hover{background:var(--panel2);color:var(--accent)}
ul.links li .n{color:var(--muted);font-size:11px;margin-left:6px}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--cyc);color:var(--cyc);
  border-radius:6px;padding:2px 8px;margin:0 6px 6px 0;font-size:11px;cursor:pointer;font-family:var(--mono)}
.chip:hover{background:var(--cyc);color:#14171c}
.muted{color:var(--muted)}
details.unres{margin-top:4px}
details.unres summary{cursor:pointer;color:var(--muted)}
details.unres div{font-family:var(--mono);font-size:11px;margin-top:6px;word-break:break-all}
/* SVG */
.node{cursor:pointer}
.node rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.2;rx:7}
.node text{fill:var(--text);font:12px var(--mono);pointer-events:none}
.node .badge{fill:var(--muted);font:10px var(--mono)}
.node.dir rect{fill:#262d3a;stroke:#4a5364}
.node.external rect{stroke-dasharray:5 4;fill:#1d222b;stroke:var(--ext)}
.node.external text{fill:var(--ext)}
.node.unscanned rect{stroke-dasharray:2 3}
.node.hub rect{stroke:var(--hub);stroke-width:2.4}
.node.cyc rect{stroke:var(--cyc);stroke-width:2}
.node.selected rect{stroke:var(--accent);stroke-width:2.6;filter:drop-shadow(0 0 6px rgba(92,200,255,.55))}
.node.hit rect{stroke:var(--hit);stroke-width:2.4}
.node.dim{opacity:.18}
path.edge{fill:none;stroke:var(--edge);stroke-width:1.4;opacity:.85}
path.edge.cyc{stroke:var(--cyc)}
path.edge.ext{stroke-dasharray:5 4;stroke:var(--ext);opacity:.6}
path.edge.hl{stroke:var(--accent);opacity:1}
path.edge.dim{opacity:.07}
rect.hull{fill:var(--hull);fill-opacity:.42;stroke:#4a5364;stroke-dasharray:6 4;rx:12}
text.hullLabel{fill:var(--muted);font:11px var(--mono);cursor:pointer}
text.hullLabel:hover{fill:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <div id="toolbar">
      <button id="btnFit" title="Fit graph to view">Fit</button>
      <button id="btnExpand" title="Expand every directory">Expand all</button>
      <button id="btnCollapse" title="Collapse to top level">Collapse all</button>
      <label><input type="checkbox" id="chkExt" checked> externals</label>
      <input id="search" type="search" placeholder="search files...">
    </div>
    <div id="hint">click folder: expand &middot; click hull label: collapse &middot; click file: inspect &middot; drag: move &middot; wheel: zoom</div>
    <svg id="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--edge)"></path>
        </marker>
        <marker id="arrowCyc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--cyc)"></path>
        </marker>
        <marker id="arrowHl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--accent)"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="hulls"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>
  </div>
  <div id="side">
    <h1 id="title"></h1>
    <div class="sub" id="meta"></div>
    <div id="sideScroll">
      <div class="stats" id="stats"></div>
      <div id="cyclesBox"></div>
      <div id="unresolvedBox"></div>
      <h2>selection</h2>
      <div id="selBox" class="muted">click a node</div>
    </div>
  </div>
</div>

<script>
window.REPO_GRAPH_DATA = __REPO_GRAPH_DATA__;
</script>
<script>
'use strict';
/* ================= pure logic (exposed on window.RG for tests) ============ */

function buildTree(nodes, rootLabel){
  const dirs = new Map();
  function ensureDir(path){
    if (dirs.has(path)) return dirs.get(path);
    const d = { id: path, label: path ? path.split('/').pop() : rootLabel,
                parent: null, childDirs: [], files: [] };
    dirs.set(path, d);
    if (path !== ''){
      const pp = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
      const parent = ensureDir(pp);
      d.parent = pp;
      parent.childDirs.push(path);
    }
    return d;
  }
  ensureDir('');
  const fileDir = new Map();
  for (const n of nodes){
    if (n.kind !== 'internal') continue;
    const p = n.id;
    const dir = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
    ensureDir(dir).files.push(p);
    fileDir.set(p, dir);
  }
  return { dirs, fileDir };
}

/* Merge chains: a directory with exactly one child directory and no files
   folds into the child, GitHub-style ("python/src/moonshine_voice"). */
function compressTree(dirs){
  let changed = true;
  while (changed){
    changed = false;
    for (const [path, d] of dirs){
      if (path === '') continue;
      if (d.childDirs.length === 1 && d.files.length === 0){
        const child = dirs.get(d.childDirs[0]);
        child.label = d.label + '/' + child.label;
        child.parent = d.parent;
        const parent = dirs.get(d.parent);
        parent.childDirs = parent.childDirs.map(c => c === path ? child.id : c);
        dirs.delete(path);
        changed = true;
        break;
      }
    }
  }
  return dirs;
}

function dirChain(dirs, dirPath){
  const c = [];
  let p = dirPath;
  while (p !== null && p !== undefined){
    c.push(p);
    p = (p === '') ? null : dirs.get(p).parent;
  }
  c.reverse();
  return c; /* root '' ... leaf dir */
}

/* representative of a file under the current expansion: the outermost
   collapsed ancestor directory, or the file itself if the whole chain
   is expanded */
function makeRepOf(dirs, fileDir, expanded){
  const cache = new Map();
  return function(fileId){
    const dir = fileDir.get(fileId);
    if (dir === undefined) return fileId; /* external or unknown */
    let chain = cache.get(dir);
    if (!chain){ chain = dirChain(dirs, dir); cache.set(dir, chain); }
    for (const d of chain){ if (!expanded.has(d)) return d; }
    return fileId;
  };
}

function aggregateEdges(edges, repOf, externalsVisible){
  const m = new Map();
  for (const e of edges){
    const s = repOf(e.source);
    let t;
    if (e.external){
      if (!externalsVisible) continue;
      t = e.target;
    } else {
      t = repOf(e.target);
    }
    if (s === t) continue;
    const k = s + '\u0000' + t;
    let a = m.get(k);
    if (!a){
      a = { source: s, target: t, statements: 0, names: new Set(),
            cyclic: false, external: !!e.external, members: 0 };
      m.set(k, a);
    }
    a.statements += e.statements;
    (e.names || []).forEach(n => a.names.add(n));
    a.cyclic = a.cyclic || !!e.cyclic;
    a.members += 1;
  }
  return [...m.values()];
}

/* iterative Tarjan SCC over the visible aggregated graph */
function sccCondense(nodeIds, edges){
  const adj = new Map(nodeIds.map(n => [n, []]));
  for (const e of edges){
    if (adj.has(e.source) && adj.has(e.target)) adj.get(e.source).push(e.target);
  }
  const idx = new Map(), low = new Map(), onstk = new Set(), stack = [], comp = new Map();
  let counter = 0, ncomp = 0;
  for (const root of nodeIds){
    if (idx.has(root)) continue;
    const work = [[root, 0]];
    while (work.length){
      const frame = work[work.length - 1];
      const v = frame[0];
      if (frame[1] === 0){
        idx.set(v, counter); low.set(v, counter); counter++;
        stack.push(v); onstk.add(v);
      }
      const nbrs = adj.get(v);
      let advanced = false;
      while (frame[1] < nbrs.length){
        const w = nbrs[frame[1]++];
        if (!idx.has(w)){ work.push([w, 0]); advanced = true; break; }
        else if (onstk.has(w)) low.set(v, Math.min(low.get(v), idx.get(w)));
      }
      if (advanced) continue;
      if (low.get(v) === idx.get(v)){
        while (true){
          const w = stack.pop(); onstk.delete(w); comp.set(w, ncomp);
          if (w === v) break;
        }
        ncomp++;
      }
      work.pop();
      if (work.length){
        const u = work[work.length - 1][0];
        low.set(u, Math.min(low.get(u), low.get(v)));
      }
    }
  }
  return { comp, ncomp };
}

/* longest-path layering on the SCC condensation: depth per visible node */
function layerDepths(nodeIds, edges){
  const { comp, ncomp } = sccCondense(nodeIds, edges);
  const cadj = Array.from({ length: ncomp }, () => new Set());
  const indeg = new Array(ncomp).fill(0);
  for (const e of edges){
    if (!comp.has(e.source) || !comp.has(e.target)) continue;
    const a = comp.get(e.source), b = comp.get(e.target);
    if (a !== b && !cadj[a].has(b)){ cadj[a].add(b); indeg[b]++; }
  }
  const depth = new Array(ncomp).fill(0);
  const q = [];
  for (let i = 0; i < ncomp; i++) if (indeg[i] === 0) q.push(i);
  while (q.length){
    const v = q.shift();
    for (const w of cadj[v]){
      depth[w] = Math.max(depth[w], depth[v] + 1);
      if (--indeg[w] === 0) q.push(w);
    }
  }
  const out = new Map();
  for (const n of nodeIds) out.set(n, depth[comp.get(n)] || 0);
  return { depths: out, comp };
}

if (typeof window !== 'undefined'){
  window.RG = { buildTree, compressTree, dirChain, makeRepOf, aggregateEdges,
                sccCondense, layerDepths };
}

/* ============================ viewer ====================================== */
if (typeof document !== 'undefined' && document.getElementById('canvas')){
(function(){
  const DATA = window.REPO_GRAPH_DATA;
  const nodesById = new Map(DATA.nodes.map(n => [n.id, n]));
  const { dirs, fileDir } = buildTree(DATA.nodes, DATA.root_label);
  compressTree(dirs);

  /* ---- state ---- */
  const expanded = new Set(['']);
  /* auto-expand while the view is a single lone folder */
  (function autoOpen(){
    for (;;){
      const top = dirs.get('');
      let cur = top;
      let hops = 0;
      while (cur.files.length === 0 && cur.childDirs.length === 1 && hops < 32){
        const next = dirs.get(cur.childDirs[0]);
        if (!expanded.has(cur.id)) expanded.add(cur.id);
        cur = next; hops++;
      }
      if (cur !== top && cur.files.length === 0 && cur.childDirs.length === 1) continue;
      if (top.files.length === 0 && top.childDirs.length === 1) expanded.add(top.childDirs[0]);
      break;
    }
  })();

  let externalsVisible = true;
  let selected = null;
  let query = '';

  /* persisted positions across renders */
  const pos = new Map();   /* id -> {x,y,vx,vy,fx,fy} */
  let visNodes = [];       /* render list */
  let visEdges = [];
  let hullDirs = [];
  let alpha = 0;

  /* ---- measuring ---- */
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = '12px ui-monospace, monospace';
  function textW(s){ return meas.measureText(s).width; }

  /* ---- svg refs ---- */
  const svg = document.getElementById('canvas');
  const viewport = document.getElementById('viewport');
  const gHulls = document.getElementById('hulls');
  const gEdges = document.getElementById('edges');
  const gNodes = document.getElementById('nodes');
  const view = { tx: 60, ty: 60, k: 1 };

  function applyView(){
    viewport.setAttribute('transform',
      'translate(' + view.tx + ',' + view.ty + ') scale(' + view.k + ')');
  }

  /* ---- helpers ---- */
  function isDir(id){ return dirs.has(id); }
  function descendFiles(dirId){
    const out = [];
    const stk = [dirId];
    while (stk.length){
      const d = dirs.get(stk.pop());
      out.push(...d.files);
      stk.push(...d.childDirs);
    }
    return out;
  }
  function labelOf(id){
    if (isDir(id)) return dirs.get(id).label;
    const n = nodesById.get(id);
    if (n && n.kind === 'external') return id;
    return id.includes('/') ? id.slice(id.lastIndexOf('/') + 1) : id;
  }

  function nodeBox(v){
    const lbl = v.text;
    const w = Math.min(280, Math.max(46, textW(lbl) + (v.dir ? 44 : 22)));
    const h = v.dir ? 30 : 24;
    return { w, h };
  }

  /* ---- structural recompute ---- */
  function recompute(){
    const repOf = makeRepOf(dirs, fileDir, expanded);
    const repSet = new Map(); /* id -> meta */
    for (const n of DATA.nodes){
      if (n.kind !== 'internal') continue;
      const r = repOf(n.id);
      if (!repSet.has(r)){
        if (isDir(r)){
          repSet.set(r, { id: r, dir: true });
        } else {
          repSet.set(r, { id: r, dir: false, data: n });
        }
      }
    }
    visEdges = aggregateEdges(DATA.edges, repOf, externalsVisible);
    if (externalsVisible){
      for (const e of visEdges){
        if (e.external && !repSet.has(e.target)){
          repSet.set(e.target, { id: e.target, dir: false,
                                 data: nodesById.get(e.target) || { id: e.target, kind: 'external' } });
        }
      }
    }
    /* dir meta: file counts, aggregate flags */
    visNodes = [];
    for (const meta of repSet.values()){
      const v = { id: meta.id, dir: meta.dir };
      if (meta.dir){
        const files = descendFiles(meta.id);
        v.count = files.length;
        v.cyc = files.some(f => (nodesById.get(f) || {}).in_cycle);
        v.text = labelOf(meta.id) + '  [' + v.count + ']';
        v.title = (meta.id || DATA.root_label) + '\n' + v.count + ' files  (click to expand)';
      } else {
        const d = meta.data || {};
        v.kind = d.kind || 'internal';
        v.cyc = !!d.in_cycle;
        v.hub = !!d.hub;
        v.unscanned = d.scanned === false;
        v.text = labelOf(meta.id);
        v.title = meta.id +
          (v.kind === 'external' ? '\nexternal package' :
            '\nin ' + (d.in_degree || 0) + '  out ' + (d.out_degree || 0) +
            '  betweenness ' + (d.betweenness != null ? d.betweenness : 0)) +
          (v.unscanned ? '\n(resolved target, outside the scanned set)' : '');
      }
      const b = nodeBox(v);
      v.w = b.w; v.h = b.h;
      visNodes.push(v);
    }

    /* depths for left-to-right flow */
    const { depths } = layerDepths(visNodes.map(v => v.id), visEdges);
    let maxD = 0;
    for (const v of visNodes){ v.depth = depths.get(v.id) || 0; maxD = Math.max(maxD, v.depth); }
    for (const v of visNodes){ if (v.kind === 'external') v.depth = Math.max(v.depth, maxD); }

    /* seed / keep positions */
    const byDepth = new Map();
    for (const v of visNodes){
      if (!byDepth.has(v.depth)) byDepth.set(v.depth, []);
      byDepth.get(v.depth).push(v);
    }
    for (const [d, arr] of byDepth){
      arr.forEach((v, i) => {
        let p = pos.get(v.id);
        if (!p){
          /* children appear near their (former) group, groups at child centroid */
          let sx = 100 + d * 280, sy = 90 + i * 58;
          if (isDir(v.id)){
            const kids = descendFiles(v.id).filter(f => pos.has(f));
            if (kids.length){
              sx = kids.reduce((a, f) => a + pos.get(f).x, 0) / kids.length;
              sy = kids.reduce((a, f) => a + pos.get(f).y, 0) / kids.length;
            }
          } else {
            const dir = fileDir.get(v.id);
            if (dir !== undefined){
              const chain = dirChain(dirs, dir);
              for (let i2 = chain.length - 1; i2 >= 0; i2--){
                if (pos.has(chain[i2])){
                  const gp = pos.get(chain[i2]);
                  sx = gp.x + (Math.random() - .5) * 120;
                  sy = gp.y + (Math.random() - .5) * 120;
                  break;
                }
              }
            }
          }
          p = { x: sx, y: sy, vx: 0, vy: 0 };
          pos.set(v.id, p);
        }
        v.p = p;
      });
    }

    /* hull directories: expanded, fully-visible chain, has visible content */
    hullDirs = [];
    for (const [id] of dirs){
      if (id === '' || !expanded.has(id)) continue;
      const chain = dirChain(dirs, id);
      if (!chain.every(c => expanded.has(c))) continue;
      hullDirs.push(id);
    }
    hullDirs.sort((a, b) => dirChain(dirs, a).length - dirChain(dirs, b).length);

    /* innermost expanded group per node, for cohesion */
    for (const v of visNodes){
      v.group = null;
      if (!v.dir && v.kind !== 'external'){
        const dir = fileDir.get(v.id);
        if (dir !== undefined){
          const chain = dirChain(dirs, dir);
          for (let i = chain.length - 1; i >= 0; i--){
            if (chain[i] !== '' && expanded.has(chain[i])){ v.group = chain[i]; break; }
          }
        }
      } else if (v.dir){
        const parentChain = dirChain(dirs, v.id);
        for (let i = parentChain.length - 2; i >= 0; i--){
          if (parentChain[i] !== '' && expanded.has(parentChain[i])){ v.group = parentChain[i]; break; }
        }
      }
    }
    rebuildDom();
    reheat(1.0);
    refreshSide();
  }

  /* ---- DOM build ---- */
  const nodeEls = new Map(), edgeEls = new Map(), hullEls = new Map();
  function el(tag, attrs){
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function rebuildDom(){
    gNodes.innerHTML = ''; gEdges.innerHTML = ''; gHulls.innerHTML = '';
    nodeEls.clear(); edgeEls.clear(); hullEls.clear();

    for (const id of hullDirs){
      const r = el('rect', { class: 'hull' });
      const t = el('text', { class: 'hullLabel' });
      t.textContent = '\u25BE ' + (dirs.get(id).label) + '  (collapse)';
      t.addEventListener('click', ev => { ev.stopPropagation(); collapseDir(id); });
      gHulls.appendChild(r); gHulls.appendChild(t);
      hullEls.set(id, { r, t });
    }
    for (const e of visEdges){
      const cls = 'edge' + (e.cyclic ? ' cyc' : '') + (e.external ? ' ext' : '');
      const p = el('path', { class: cls, 'marker-end': e.cyclic ? 'url(#arrowCyc)' : 'url(#arrow)' });
      const names = [...e.names].slice(0, 14);
      const extra = e.names.size > 14 ? ('  +' + (e.names.size - 14) + ' more') : '';
      const tt = el('title', {});
      tt.textContent = e.source + '  \u2192  ' + e.target +
        '\n' + e.statements + ' import statement' + (e.statements === 1 ? '' : 's') +
        (names.length ? '\n{ ' + names.join(', ') + extra + ' }' : '');
      p.appendChild(tt);
      gEdges.appendChild(p);
      edgeEls.set(e.source + '\u0000' + e.target, { el: p, e });
    }
    for (const v of visNodes){
      const g = el('g', { class: 'node' });
      g.classList.toggle('dir', !!v.dir);
      g.classList.toggle('external', v.kind === 'external');
      g.classList.toggle('cyc', !!v.cyc);
      g.classList.toggle('hub', !!v.hub);
      g.classList.toggle('unscanned', !!v.unscanned);
      const r = el('rect', { width: v.w, height: v.h, x: -v.w / 2, y: -v.h / 2, rx: 7 });
      const t = el('text', { x: -v.w / 2 + (v.dir ? 26 : 10), y: 4 });
      t.textContent = v.dir ? dirs.get(v.id).label : v.text;
      const tt = el('title', {}); tt.textContent = v.title;
      g.appendChild(r); g.appendChild(tt); g.appendChild(t);
      if (v.dir){
        const chev = el('text', { class: 'badge', x: -v.w / 2 + 9, y: 4 });
        chev.textContent = '\u25B8';
        const badge = el('text', { class: 'badge', x: v.w / 2 - 8, y: 4, 'text-anchor': 'end' });
        badge.textContent = String(v.count);
        g.appendChild(chev); g.appendChild(badge);
      }
      attachNodeEvents(g, v);
      gNodes.appendChild(g);
      nodeEls.set(v.id, { g, v });
    }
    applySearchClasses();
    applySelectionClasses();
  }

  /* ---- interactions ---- */
  function expandDir(id){ expanded.add(id); recompute(); }
  function collapseDir(id){
    /* collapse this dir and every expanded descendant */
    const stk = [id];
    while (stk.length){
      const d = stk.pop();
      expanded.delete(d);
      dirs.get(d).childDirs.forEach(c => { if (expanded.has(c)) stk.push(c); });
    }
    if (selected && !nodesVisible(selected)) selected = null;
    recompute();
  }
  function nodesVisible(id){ return visNodes.some(v => v.id === id); }

  let drag = null;
  function attachNodeEvents(g, v){
    g.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      g.setPointerCapture(ev.pointerId);
      drag = { v, sx: ev.clientX, sy: ev.clientY, moved: false,
               ox: v.p.x, oy: v.p.y };
    });
    g.addEventListener('pointermove', ev => {
      if (!drag || drag.v !== v) return;
      const dx = (ev.clientX - drag.sx) / view.k, dy = (ev.clientY - drag.sy) / view.k;
      if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 4) drag.moved = true;
      v.p.fx = drag.ox + dx; v.p.fy = drag.oy + dy;
      v.p.x = v.p.fx; v.p.y = v.p.fy;
      reheat(0.25);
    });
    g.addEventListener('pointerup', ev => {
      if (!drag || drag.v !== v) return;
      const wasDrag = drag.moved;
      delete v.p.fx; delete v.p.fy;
      drag = null;
      if (!wasDrag){
        if (v.dir) expandDir(v.id);
        else selectNode(v.id);
      }
    });
  }

  function selectNode(id){
    selected = (selected === id) ? null : id;
    applySelectionClasses();
    refreshSide();
  }
  function applySelectionClasses(){
    const neigh = new Set();
    if (selected){
      neigh.add(selected);
      for (const e of visEdges){
        if (e.source === selected) neigh.add(e.target);
        if (e.target === selected) neigh.add(e.source);
      }
    }
    for (const { g, v } of nodeEls.values()){
      g.classList.toggle('selected', v.id === selected);
      g.classList.toggle('dim', !!selected && !neigh.has(v.id));
    }
    for (const { el: p, e } of edgeEls.values()){
      const on = selected && (e.source === selected || e.target === selected);
      p.classList.toggle('hl', !!on);
      if (on) p.setAttribute('marker-end', 'url(#arrowHl)');
      else p.setAttribute('marker-end', e.cyclic ? 'url(#arrowCyc)' : 'url(#arrow)');
      p.classList.toggle('dim', !!selected && !on);
    }
  }

  function applySearchClasses(){
    const q = query.trim().toLowerCase();
    for (const { g, v } of nodeEls.values()){
      let hit = false;
      if (q){
        if (v.dir) hit = descendFiles(v.id).some(f => f.toLowerCase().includes(q));
        else hit = v.id.toLowerCase().includes(q);
      }
      g.classList.toggle('hit', !!q && hit);
      if (!selected) g.classList.toggle('dim', !!q && !hit);
    }
    if (!selected){
      for (const { el: p } of edgeEls.values()) p.classList.toggle('dim', !!q);
    }
  }

  /* ---- physics ----
     Two cooperating systems:
       1. force layout (charge + springs + depth columns), scaled by alpha,
          gives the organic shape and cools to rest.
       2. rectangular collision, a positional constraint run every frame at
          full strength regardless of alpha, so boxes never overlap even
          after the layout cools. Resolves along the axis of least
          penetration; a dragged node is immovable and others yield. */
  const PAD_X = 24, PAD_Y = 16;   /* minimum gap between boxes */
  let settle = 0;
  function reheat(a){
    alpha = Math.max(alpha, a); settle = 0;
    if (!ticking){ ticking = true; requestAnimationFrame(tick); }
  }
  let ticking = false;
  function tick(){
    if (alpha > 0.02){
      step();
      collide(3, 0.9);
      alpha *= 0.97;
      draw();
      requestAnimationFrame(tick);
    } else {
      /* cooled: keep resolving collisions until nothing moves */
      const moved = collide(8, 0.8);
      draw();
      if (moved > 0.4 && settle++ < 120) requestAnimationFrame(tick);
      else ticking = false;
    }
  }

  function step(){
    const n = visNodes.length;
    /* charge repulsion: spreads disconnected pieces, fades with alpha.
       Hard separation is the collision pass, not this. */
    for (let i = 0; i < n; i++){
      const a = visNodes[i];
      for (let j = i + 1; j < n; j++){
        const b = visNodes[j];
        let dx = a.p.x - b.p.x, dy = a.p.y - b.p.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1){ dx = (Math.random() - .5); dy = (Math.random() - .5); d2 = 1; }
        let f = Math.min(2200 / d2, 9) * alpha;
        const d = Math.sqrt(d2);
        const ux = dx / d, uy = dy / d;
        a.p.vx += ux * f; a.p.vy += uy * f;
        b.p.vx -= ux * f; b.p.vy -= uy * f;
      }
    }
    /* springs */
    const byId = new Map(visNodes.map(v => [v.id, v]));
    for (const e of visEdges){
      const a = byId.get(e.source), b = byId.get(e.target);
      if (!a || !b) continue;
      const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
      const d = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
      const rest = 150 + (a.w + b.w) / 4;
      const f = 0.012 * (d - rest) * alpha;
      const ux = dx / d, uy = dy / d;
      a.p.vx += ux * f * d * 0.06; a.p.vy += uy * f * d * 0.06;
      b.p.vx -= ux * f * d * 0.06; b.p.vy -= uy * f * d * 0.06;
    }
    /* depth columns + group cohesion + weak vertical centering */
    const groupC = new Map();
    for (const v of visNodes){
      if (v.group){
        let g = groupC.get(v.group);
        if (!g){ g = { x: 0, y: 0, n: 0 }; groupC.set(v.group, g); }
        g.x += v.p.x; g.y += v.p.y; g.n++;
      }
    }
    for (const v of visNodes){
      const tx = 100 + v.depth * 280;
      v.p.vx += (tx - v.p.x) * 0.055 * alpha;
      v.p.vy += (300 - v.p.y) * 0.004 * alpha;
      if (v.group){
        const g = groupC.get(v.group);
        v.p.vy += (g.y / g.n - v.p.y) * 0.05 * alpha;
      }
    }
    /* integrate */
    for (const v of visNodes){
      if (v.p.fx != null){ v.p.x = v.p.fx; v.p.y = v.p.fy; v.p.vx = 0; v.p.vy = 0; continue; }
      v.p.vx *= 0.78; v.p.vy *= 0.78;
      v.p.x += v.p.vx; v.p.y += v.p.vy;
    }
  }

  /* Rectangular collision as a positional constraint. Returns the largest
     single move applied, so the caller knows when the layout is at rest. */
  function collide(iters, relax){
    const n = visNodes.length;
    let maxMove = 0;
    for (let it = 0; it < iters; it++){
      for (let i = 0; i < n; i++){
        const a = visNodes[i];
        const aFixed = a.p.fx != null;
        for (let j = i + 1; j < n; j++){
          const b = visNodes[j];
          let dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
          const minX = (a.w + b.w) / 2 + PAD_X;
          const minY = (a.h + b.h) / 2 + PAD_Y;
          const ox = minX - Math.abs(dx);
          const oy = minY - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;       /* not overlapping */
          const bFixed = b.p.fx != null;
          if (aFixed && bFixed) continue;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1){
            /* coincident: fan apart on an index-derived direction so a
               whole pile spreads radially instead of into two stacks */
            const ang = i * 2.3999632;            /* golden angle */
            const nx = Math.cos(ang), ny = Math.sin(ang);
            if (!aFixed){ a.p.x -= nx * 5; a.p.y -= ny * 5; }
            if (!bFixed){ b.p.x += nx * 5; b.p.y += ny * 5; }
            if (5 > maxMove) maxMove = 5;
            continue;
          }
          if (ox < oy){
            /* separate horizontally (axis of least penetration) */
            let dir = dx > 0 ? 1 : (dx < 0 ? -1 : ((i + j) % 2 ? 1 : -1));
            const m = ox * relax;
            if (aFixed){ b.p.x += m * dir; }
            else if (bFixed){ a.p.x -= m * dir; }
            else { a.p.x -= m / 2 * dir; b.p.x += m / 2 * dir; }
            if (m > maxMove) maxMove = m;
          } else {
            /* separate vertically */
            let dir = dy > 0 ? 1 : (dy < 0 ? -1 : ((i + j) % 2 ? 1 : -1));
            const m = oy * relax;
            if (aFixed){ b.p.y += m * dir; }
            else if (bFixed){ a.p.y -= m * dir; }
            else { a.p.y -= m / 2 * dir; b.p.y += m / 2 * dir; }
            if (m > maxMove) maxMove = m;
          }
        }
      }
    }
    return maxMove;
  }


  function edgePath(a, b){
    const x1 = a.p.x + a.w / 2, y1 = a.p.y;
    const x2 = b.p.x - b.w / 2 - 4, y2 = b.p.y;
    const mx = (x1 + x2) / 2;
    if (x2 > x1 + 18){
      return 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2;
    }
    /* backward edge: arc around */
    const x1b = a.p.x, y1b = a.p.y + a.h / 2;
    const x2b = b.p.x, y2b = b.p.y - b.h / 2 - 4;
    const bend = 70 + Math.abs(y2b - y1b) * 0.15;
    return 'M' + x1b + ',' + y1b + ' C' + x1b + ',' + (y1b + bend) + ' ' + x2b + ',' + (y2b - bend) + ' ' + x2b + ',' + y2b;
  }

  function draw(){
    const byId = new Map(visNodes.map(v => [v.id, v]));
    for (const { g, v } of nodeEls.values()){
      g.setAttribute('transform', 'translate(' + v.p.x + ',' + v.p.y + ')');
    }
    for (const { el: p, e } of edgeEls.values()){
      const a = byId.get(e.source), b = byId.get(e.target);
      if (a && b) p.setAttribute('d', edgePath(a, b));
    }
    for (const id of hullDirs){
      const members = visNodes.filter(v => {
        if (v.id === id) return false;
        const dir = v.dir ? dirs.get(v.id).parent : fileDir.get(v.id);
        if (dir === undefined || dir === null) return false;
        const chain = dirChain(dirs, v.dir ? v.id : dir);
        return chain.includes(id);
      });
      const h = hullEls.get(id);
      if (!h) continue;
      if (!members.length){ h.r.setAttribute('width', 0); h.t.textContent = ''; continue; }
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const m of members){
        x0 = Math.min(x0, m.p.x - m.w / 2); y0 = Math.min(y0, m.p.y - m.h / 2);
        x1 = Math.max(x1, m.p.x + m.w / 2); y1 = Math.max(y1, m.p.y + m.h / 2);
      }
      const pad = 18;
      h.r.setAttribute('x', x0 - pad); h.r.setAttribute('y', y0 - pad - 14);
      h.r.setAttribute('width', (x1 - x0) + pad * 2);
      h.r.setAttribute('height', (y1 - y0) + pad * 2 + 14);
      h.t.setAttribute('x', x0 - pad + 8); h.t.setAttribute('y', y0 - pad);
    }
  }

  /* ---- pan / zoom ---- */
  let pan = null;
  svg.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.node') || ev.target.classList.contains('hullLabel')) return;
    pan = { sx: ev.clientX, sy: ev.clientY, tx: view.tx, ty: view.ty };
    svg.classList.add('panning');
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (!pan) return;
    view.tx = pan.tx + (ev.clientX - pan.sx);
    view.ty = pan.ty + (ev.clientY - pan.sy);
    applyView();
  });
  svg.addEventListener('pointerup', ev => {
    if (pan && Math.abs(ev.clientX - pan.sx) + Math.abs(ev.clientY - pan.sy) < 4){
      selected = null; applySelectionClasses(); refreshSide();
    }
    pan = null; svg.classList.remove('panning');
  });
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const k2 = Math.min(4, Math.max(0.08, view.k * Math.exp(-ev.deltaY * 0.0012)));
    view.tx = mx - (mx - view.tx) * (k2 / view.k);
    view.ty = my - (my - view.ty) * (k2 / view.k);
    view.k = k2;
    applyView();
  }, { passive: false });

  function fitView(){
    if (!visNodes.length) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const v of visNodes){
      x0 = Math.min(x0, v.p.x - v.w / 2); y0 = Math.min(y0, v.p.y - v.h / 2);
      x1 = Math.max(x1, v.p.x + v.w / 2); y1 = Math.max(y1, v.p.y + v.h / 2);
    }
    const rect = svg.getBoundingClientRect();
    const pad = 60;
    const k = Math.min(2.2, Math.max(0.08,
      Math.min((rect.width - pad) / Math.max(x1 - x0, 1),
               (rect.height - pad) / Math.max(y1 - y0, 1))));
    view.k = k;
    view.tx = (rect.width - (x1 + x0) * k) / 2;
    view.ty = (rect.height - (y1 + y0) * k) / 2;
    applyView();
  }

  /* ---- sidebar ---- */
  const fmt = x => (x == null ? '\u2013' : String(x));
  function refreshSide(){
    document.getElementById('title').textContent = DATA.root_label;
    document.getElementById('meta').textContent =
      'repo-graph ' + DATA.version + ' \u00B7 ' + DATA.generated;
    const s = DATA.summary;
    document.getElementById('stats').innerHTML = [
      ['files', DATA.files_scanned], ['edges', s.internal_edges],
      ['external pkgs', s.external_packages], ['unresolved', s.unresolved_count],
      ['DAG', s.is_dag ? 'yes' : 'no'], ['depth', fmt(s.dependency_depth)]
    ].map(p => '<div class="stat"><b>' + p[1] + '</b><span>' + p[0] + '</span></div>').join('');

    const cb = document.getElementById('cyclesBox');
    if (s.sccs && s.sccs.length){
      cb.innerHTML = '<h2>circular groups</h2>' + s.sccs.map((c, i) =>
        '<span class="chip" data-i="' + i + '">' + c.length + ' modules</span>').join('');
      cb.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
        query = ''; document.getElementById('search').value = '';
        const members = new Set(s.sccs[+ch.dataset.i]);
        for (const { g, v } of nodeEls.values()){
          const hit = v.dir ? descendFiles(v.id).some(f => members.has(f)) : members.has(v.id);
          g.classList.toggle('hit', hit);
          g.classList.toggle('dim', !hit);
        }
      }));
    } else cb.innerHTML = '';

    const ub = document.getElementById('unresolvedBox');
    if (DATA.unresolved_by_name && DATA.unresolved_by_name.length){
      ub.innerHTML = '<h2>unresolved</h2><details class="unres"><summary>' +
        s.unresolved_count + ' imports, by package</summary><div>' +
        DATA.unresolved_by_name.map(p => p[0] + ' (' + p[1] + ')').join(', ') +
        '</div></details>';
    } else ub.innerHTML = '';

    const box = document.getElementById('selBox');
    if (!selected){ box.className = 'muted'; box.textContent = 'click a node'; return; }
    box.className = '';
    const v = visNodes.find(x => x.id === selected);
    const data = nodesById.get(selected) || {};
    const ins = visEdges.filter(e => e.target === selected);
    const outs = visEdges.filter(e => e.source === selected);
    let html = '<div id="selPath">' + escapeHtml(selected || DATA.root_label) + '</div>';
    const tags = [];
    if (v && v.dir) tags.push('<span class="tag">directory \u00B7 ' + v.count + ' files</span>');
    else {
      tags.push('<span class="tag">' + (data.kind || 'internal') + '</span>');
      if (data.in_cycle) tags.push('<span class="tag cyc">in cycle</span>');
      if (data.hub) tags.push('<span class="tag hub">bottleneck</span>');
      if (data.kind === 'internal') tags.push(
        '<span class="tag">in ' + fmt(data.in_degree) + '</span>',
        '<span class="tag">out ' + fmt(data.out_degree) + '</span>',
        '<span class="tag">betw ' + fmt(data.betweenness) + '</span>');
    }
    html += tags.join('');
    html += linkList('imported by (' + ins.length + ')', ins.map(e => [e.source, e.statements]));
    html += linkList('imports (' + outs.length + ')', outs.map(e => [e.target, e.statements]));
    box.innerHTML = html;
    box.querySelectorAll('ul.links li').forEach(li => li.addEventListener('click', () => {
      const id = li.dataset.id;
      selectNode(id);
      const t = visNodes.find(x => x.id === id);
      if (t){
        const rect = svg.getBoundingClientRect();
        view.tx = rect.width / 2 - t.p.x * view.k;
        view.ty = rect.height / 2 - t.p.y * view.k;
        applyView();
      }
    }));
  }
  function linkList(title, pairs){
    if (!pairs.length) return '<h2>' + title + '</h2><div class="muted">none</div>';
    return '<h2>' + title + '</h2><ul class="links">' + pairs.map(p =>
      '<li data-id="' + escapeHtml(p[0]) + '">' + escapeHtml(p[0]) +
      '<span class="n">\u00D7' + p[1] + '</span></li>').join('') + '</ul>';
  }
  function escapeHtml(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ---- toolbar ---- */
  document.getElementById('btnFit').addEventListener('click', fitView);
  document.getElementById('btnExpand').addEventListener('click', () => {
    for (const [id] of dirs) expanded.add(id);
    recompute();
    setTimeout(fitView, 350);
  });
  document.getElementById('btnCollapse').addEventListener('click', () => {
    expanded.clear(); expanded.add('');
    selected = null;
    recompute();
    setTimeout(fitView, 350);
  });
  document.getElementById('chkExt').addEventListener('change', ev => {
    externalsVisible = ev.target.checked;
    if (selected && !nodesVisible(selected)) selected = null;
    recompute();
  });
  document.getElementById('search').addEventListener('input', ev => {
    query = ev.target.value;
    applySearchClasses();
  });

  /* ---- boot ---- */
  applyView();
  recompute();
  setTimeout(fitView, 420);
})();
}
</script>
</body>
</html>
